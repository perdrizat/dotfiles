# ==========================
# Screen Muscle Memory
# ==========================
# Change prefix from 'Ctrl-B' to 'Ctrl-A'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==========================
# Sane Defaults
# ==========================
# Start counting windows and panes from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# Fast escape time (crucial for Vim/Neovim users)
set -sg escape-time 10

# Forward terminal focus-in/out events to apps (Claude Code, Vim) so they can
# tell when their pane is focused — needed for correct notification timing.
set -g focus-events on

# Increase scrollback history
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ==========================
# Mouse & Selection Behavior
# ==========================
# MOUSE ENABLED so scroll wheel natively scrolls tmux history instead of
# sending up/down arrows to apps (like agy).
# To use terminal native copy/paste, hold 'Shift' while selecting text.
set -g mouse on

# ==========================
# Intuitive Window Splitting
# ==========================
# Open panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy config reload
bind r source-file ~/.tmux.conf \; display "✓ Config reloaded!"

# ==========================
# Default Layout
# ==========================
# Every NEW session opens two windows, each split vertically into a ~75% top
# pane and a ~25% bottom pane, with the top pane auto-running `claude --continue`:
#   Window 1 — the machine's default repo at ~/$WSL_DISTRO_NAME. tmux expands
#              ${...} from its environment; a missing path falls back to the launch
#              dir (validate_setup.sh flags an absent default repo).
#   Window 2 — both panes in ~/dotfiles.
# Fires on session creation only, so re-attaching (tmux attach) never re-splits.
set-hook -g session-created {
    split-window -v -l 25% -c "${HOME}/${WSL_DISTRO_NAME}"
    send-keys -t 1 "cd '${HOME}/${WSL_DISTRO_NAME}' 2>/dev/null; claude --continue" Enter
    new-window -c "~/dotfiles"
    split-window -v -l 25% -c "~/dotfiles"
    send-keys -t 1 'sleep 10 && claude --continue' Enter
    select-window -t 1
    select-pane -t 1
}

# ==========================
# Minimalist Status Bar
# ==========================
set -g status-style bg=default,fg=white
set -g status-left "#[fg=green,bold] #S #[default]  "
set -g status-left-length 20
set -g status-right "#[fg=yellow]~ #[fg=white]%H:%M "
# Label each window `index:command@repo` (e.g. `1:claude@dotfiles`) — the active
# pane's command and the basename of its working dir, mirroring a shell prompt.
setw -g window-status-current-format "#[fg=blue,bold]*#I:#{pane_current_command}@#{b:pane_current_path}*"
setw -g window-status-format " #I:#{pane_current_command}@#{b:pane_current_path} "
